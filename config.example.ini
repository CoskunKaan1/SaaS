; Bu dosyayı config.ini adıyla kopyalayıp düzenleyin.
; config.ini yoksa aşağıdaki varsayılanlar kullanılır; ilk bağlantıda
; uygulamanın bağlantı ekranı da bu dosyayı oluşturur.

[database]
; Varsayılan kurulum: localhost   ·   Express: .\SQLEXPRESS   ·   Docker: localhost,1433
server = localhost
database = ApiKrediTakip
; auto: kurulu en yeni SQL Server ODBC sürücüsünü seçer
driver = auto
; yes: Windows kimlik doğrulama, no: aşağıdaki SQL kullanıcı adı/parola
trusted_connection = yes
username =
password =
trust_server_certificate = yes
timeout = 5

[simulation]
; Uygulama açılır açılmaz sanal kullanıcılar kredi harcamaya başlasın mı?
autostart = yes
tick_seconds = 0.5
; Otomatik kredi sıfırlama aralığı (saniye). 0 = kapalı. Test panelinden de değiştirilebilir.
auto_reset_seconds = 0
; Veritabanı boşsa örnek departman/ekip/servis/kullanıcı yüklensin mi?
seed_demo_data = yes

[ui]
; light | dark
theme = light
